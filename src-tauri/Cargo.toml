[package]
name = "moonshot-inc"
version = "0.1.0"
description = "Moonshot Inc — a frontier-tech business simulation"
authors = ["Moonshot Inc"]
edition = "2021"
rust-version = "1.77.2"

# The desktop binary links against this library; `main.rs` just calls `run()`.
# The cdylib/staticlib targets keep the door open for a future mobile build.
[lib]
name = "moonshot_inc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugins: remember window geometry and keep a single instance.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[features]
# A no-op feature kept so `tauri dev`/`build` can pass `--features custom-protocol`
# style flags if needed later.
custom-protocol = ["tauri/custom-protocol"]
