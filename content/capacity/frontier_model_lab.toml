# content/capacity/frontier_model_lab.toml
# one capacity type (compute), 7 rungs: pods -> clusters -> datacenters.
# cheaper early rungs than fab lines, faster to stand up — compute scales more
# fluidly than silicon fabs, matching the fast-cadence feel of the sub-industry.

[compute]
id = "compute"
sub_industry = "frontier_model_lab"
name = "Compute"
unit_label = "cluster"
description = "The GPUs and pods your models train and serve on. Every training run and every live endpoint draws on it, and the frontier is an arms race for more. Run short and your next model waits in the allocation queue behind everyone else's."

[[compute.rungs]]
capacity = 3
cost = 4
build_weeks = 5
[[compute.rungs]]
capacity = 6
cost = 12
build_weeks = 8
