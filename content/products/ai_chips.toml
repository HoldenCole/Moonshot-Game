# content/products/ai_chips.toml
# tier 1 -> 3 progression: cheap/fast/low-margin beachhead -> bet-the-company part.
# specs are WEIGHTS (sum ~1.0) mapping R&D lines -> product quality.

[consumer_gpu]
id = "consumer_gpu"
sub_industry = "ai_chips"
name = "Consumer GPU"
tier = 1
description = "A graphics card for gamers and creators. Your entry product — lower margins, huge volume, and a brand-building beachhead. The training wheels of silicon: it teaches your fab to walk before you bet the company on datacenter parts."
flavor_naming_hint = "e.g. 'GX-1', 'Vega', a number+letter consumer brand"

[consumer_gpu.gates]
process_node = 15
architecture = 20

[consumer_gpu.economics]
build_cost = 26
build_weeks = 34
unit_margin = 0.35
capacity_type = "fab_line"
capacity_to_build = 1
capacity_to_run = 1
addressable_market = 1200
ramp_weeks = 26
decay_per_quarter = 0.04

[consumer_gpu.specs]
performance = 0.5
efficiency = 0.3
margin = 0.2

[datacenter_accel]
id = "datacenter_accel"
sub_industry = "ai_chips"
name = "Datacenter accelerator"
tier = 2
description = "The product that makes empires. Sold by the rack to AI labs and clouds, priced like jewelry, and the thing OpenMind and the hyperscalers are desperate for. Demands a real process node and flawless yield — and the AI-hype cycle can make or unmake it overnight."
flavor_naming_hint = "e.g. 'H-series', 'Hopper-class', a datacenter codename"

[datacenter_accel.gates]
process_node = 45
architecture = 40
yield_line = 35

[datacenter_accel.economics]
build_cost = 80
build_weeks = 60
unit_margin = 0.62
capacity_type = "fab_line"
capacity_to_build = 2
capacity_to_run = 2
addressable_market = 9000
ramp_weeks = 39
decay_per_quarter = 0.09

[datacenter_accel.specs]
performance = 0.55
efficiency = 0.30
margin = 0.15

[next_gen_arch]
id = "next_gen_arch"
sub_industry = "ai_chips"
name = "Next-gen architecture part"
tier = 3
description = "A generational leap — a part that redefines the category and locks in customers for years. Requires bleeding-edge everything and a fortune, but if it lands you set the market's pace and the rivals chase you."
flavor_naming_hint = "e.g. a bold codename — 'Helios', 'Titan'"

[next_gen_arch.gates]
process_node = 70
architecture = 65
yield_line = 55

[next_gen_arch.economics]
build_cost = 175
build_weeks = 100
unit_margin = 0.68
capacity_type = "fab_line"
capacity_to_build = 3
capacity_to_run = 2
addressable_market = 16000
ramp_weeks = 52
decay_per_quarter = 0.10

[next_gen_arch.specs]
performance = 0.6
efficiency = 0.25
margin = 0.15

# ---------------------------------------------------------------------------
# TIER 0 — Components. Cheaper, faster, low-gate parts that generate early
# revenue and fill the weeks between tape-out bets. Each is well below the
# Consumer GPU floor ($40M/60w) in cost and time.
# ---------------------------------------------------------------------------

[memory_module]
id = "memory_module"
sub_industry = "ai_chips"
name = "Memory module"
tier = 0
description = """DRAM and high-bandwidth memory stacks — the commodity workhorse \
of the fab. Thin margins, steady demand, and a forgiving process. The first thing \
a young fab makes to keep the lines warm and the cash trickling in while you chase \
bigger silicon."""
flavor_naming_hint = "e.g. 'M-series', a memory part number"

[memory_module.gates]
yield_line = 15

[memory_module.economics]
build_cost = 1.5
build_weeks = 5
unit_margin = 0.22
capacity_type = "fab_line"
capacity_to_build = 1
capacity_to_run = 1
addressable_market = 500
ramp_weeks = 10
decay_per_quarter = 0.05

[memory_module.specs]
margin = 0.5
cost = 0.3
efficiency = 0.2

[io_controller]
id = "io_controller"
sub_industry = "ai_chips"
name = "I/O controller"
tier = 0
description = """The unglamorous interconnect and I/O dies that move data around a \
board — USB, PCIe, networking controllers. Low-margin, high-volume glue chips \
that every system needs. Reliable revenue that asks little of your process node."""
flavor_naming_hint = "e.g. 'IOC-100', a controller part number"

[io_controller.gates]
architecture = 15

[io_controller.economics]
build_cost = 2.5
build_weeks = 6
unit_margin = 0.28
capacity_type = "fab_line"
capacity_to_build = 1
capacity_to_run = 1
addressable_market = 600
ramp_weeks = 12
decay_per_quarter = 0.05

[io_controller.specs]
performance = 0.4
cost = 0.35
margin = 0.25

[embedded_soc]
id = "embedded_soc"
sub_industry = "ai_chips"
name = "Embedded SoC"
tier = 0
description = """A small system-on-chip for phones, appliances, and edge devices — \
modest compute, tight power budget, sold by the million. Lower stakes than a \
datacenter part, and a great way to bank architecture experience on someone \
else's volume."""
