body = "A battery chemistry found in your Oracle's queue eighteen months ago is now in a car you can buy. The press kit thanks your machine in the third paragraph. The century's supply chains will be full of third paragraphs like it."

[quantum_crypto_migration]
id = "quantum_crypto_migration"
pool = "quantum_services_events"
kind = "opportunity"
weight = 1.0
cooldown_weeks = 85
headline = "The banks want you to break them first"
body = "A consortium of financial institutions offers a standing engagement: attack their post-quantum cryptography with your own hardware, continuously, before anyone else can. Being the world's licensed lockpick pays magnificently — and means holding a list of every door you've opened."
choices = [
  { label = "Take the red-team mandate", effects = { revenue_delta = 45, power_delta = 0.5, reputation_delta = -1 } },
