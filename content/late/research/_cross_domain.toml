# research/_cross_domain — the 7 synergy-research nodes (validated).
[ai_designed_silicon]
id = "ai_designed_silicon"
name = "AI-Designed Silicon"
description = """Your own models turned loose on chip design, exploring architecture spaces no human team could walk. Only possible if you run both a frontier lab and a fab — and it makes each better than either could be alone."""
tier = "cross_domain"

[ai_designed_silicon.requires]
fronts = ["frontier_model_lab", "ai_chips"]
rd_levels = { scaling = 50, architecture = 50 }
projects = []
stature_min = 12000

[ai_designed_silicon.cost]
budget = 90
weeks = 60

[ai_designed_silicon.unlocks]
synergy_tags = ["ai_chip_codesign"]

[vertically_integrated_ai]
id = "vertically_integrated_ai"
name = "Vertically Integrated AI"
description = """Models, silicon, and software as one pipeline — each layer tuned to the others' exact shape. The stack nobody can buy piecemeal, because no piece of it is for sale."""
tier = "cross_domain"

[vertically_integrated_ai.requires]
fronts = ["frontier_model_lab", "ai_chips", "vertical_ai_saas"]
rd_levels = { scaling = 60, architecture = 60, platform = 55 }
projects = ["ai_designed_silicon"]
stature_min = 20000

[vertically_integrated_ai.cost]
budget = 180
weeks = 80

[vertically_integrated_ai.unlocks]
synergy_tags = ["full_ai_stack"]

